# Bundle consumed by the hyperconverged-cluster-operator (HCO), rendered by
# 'make build-installer-hco' into dist/install-hco.yaml.
#
# HCO embeds this file and deploys everything in it at runtime, the CRD
# included. It rewrites the namespace, replaces both image references from its
# own environment and adds its labels and node placement.
#
# The manager serves metrics on :8443. HCO injects what depends on the cluster:
# - the serving certificate in the metrics-certs volume (service-ca on
#   OpenShift, cert-manager on Kubernetes);
# - the TLS profile and, on OpenShift, the client certificate flags;
# - the ServiceMonitor TLS and auth settings, which are stripped below.
#
# Unlike config/default this overlay carries no cert-manager resources and no
# egress network policies. HCO builds the network policy that allows egress to
# DNS and the API server.

# Placeholder, HCO deploys into its own namespace.
namespace: kubevirt

namePrefix: virt-import-

resources:
- ../crd
- ../rbac
- ../manager
- ../admission
- ../metrics
- ../prometheus
- ../network-policy/ingress
- metrics_reader_service_account.yaml
- metrics_token_secret.yaml
- metrics_reader_role_binding.yaml

components:
- ../components/deployment-patches
- ../components/version

patches:
# HCO sets the scrape TLS and auth per platform.
- target:
    kind: ServiceMonitor
    name: controller-manager-metrics-monitor
  patch: |-
    - op: remove
      path: /spec/endpoints/0/tlsConfig
    - op: remove
      path: /spec/endpoints/0/bearerTokenFile

replacements:
- source:
    kind: ServiceAccount
    name: metrics-reader
    fieldPath: metadata.name
  targets:
  - select:
      kind: Secret
      name: metrics-token
    fieldPaths:
    - metadata.annotations.[kubernetes.io/service-account.name]
