# ServiceAccount Prometheus scrapes with on Kubernetes. It may only GET
# /metrics, unlike the controller ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-reader
  namespace: system
  labels:
    app.kubernetes.io/name: virt-import
    app.kubernetes.io/managed-by: kustomize
    kubevirt.io: virt-import-metrics-reader
automountServiceAccountToken: false
