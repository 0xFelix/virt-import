# Long-lived token of the metrics-reader ServiceAccount. HCO points the Kubernetes
# ServiceMonitor at it, so Prometheus scrapes with a token that may GET
# /metrics (see metrics_reader_role_binding.yaml). On OpenShift Prometheus
# uses its client certificate instead.
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: metrics-token
  namespace: system
  labels:
    app.kubernetes.io/name: virt-import
    app.kubernetes.io/managed-by: kustomize
    kubevirt.io: virt-import-metrics-token
  annotations:
    # Filled in with the prefixed ServiceAccount name by a replacement.
    kubernetes.io/service-account.name: metrics-reader
