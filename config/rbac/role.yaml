---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - cdi.kubevirt.io
  resources:
  - datavolumes
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - import.kubevirt.io
  resources:
  - virtualmachineimports
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - import.kubevirt.io
  resources:
  - virtualmachineimports/finalizers
  verbs:
  - update
- apiGroups:
  - import.kubevirt.io
  resources:
