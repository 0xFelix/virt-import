# This rule is not used by the project virt-import itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the import.kubevirt.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: virtualmachineimport-editor-role
  labels:
    app.kubernetes.io/name: virt-import
    app.kubernetes.io/managed-by: kustomize
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    kubevirt.io: virt-import-virtualmachineimport-editor-role
rules:
- apiGroups:
  - import.kubevirt.io
  resources:
  - virtualmachineimports
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - import.kubevirt.io
  resources:
  - virtualmachineimports/status
  verbs:
  - get
